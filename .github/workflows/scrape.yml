name: Aggiorna prezzi
on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 4 * * *"   # ogni giorno alle 04:17 UTC (05:17 / 06:17 in Italia)
    - cron: "17 14 * * *"  # secondo giro: con il piano gratuito di Groq (~1 pagina/minuto) recupera le pagine rimaste
concurrency:
  group: aggiorna-prezzi
  cancel-in-progress: false
permissions:
  contents: write
  models: read      # GitHub Models, riserva gratuita per leggere i volantini
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # repo pubblico: minuti illimitati, massimo GitHub 6 ore (da privato tornare a ~60)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Installa dipendenze e browser headless
        run: npm ci && npx playwright install --with-deps chromium && sudo apt-get install -y poppler-utils
      - run: node scraper/scrape.mjs
        timeout-minutes: 340
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FLYER_MODEL: ${{ vars.FLYER_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          FLYER_MAX_PAGES: "2000"
          FLYER_TIME_BUDGET_MIN: "320"   # da privato: 40
      - name: Salva i dati nel repo
        if: always()   # anche se lo scraper si interrompe, le pagine già lette (cache) non si perdono
        run: |
          git config user.name "prezzi-bot"
          git config user.email "actions@users.noreply.github.com"
          # Unisce (non sovrascrive) le cache con quelle salvate nel frattempo da altri giri.
          for i in 1 2 3; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            mkdir -p /tmp/remote && for f in ai-cache match-cache history; do git show "origin/${GITHUB_REF_NAME}:data/$f.json" > "/tmp/remote/$f.json" 2>/dev/null || rm -f "/tmp/remote/$f.json"; done
            node scraper/merge-data.mjs /tmp/remote
            git add data/
            git diff --cached --quiet || git commit -q -m "Prezzi $(date -u +%F)"
            git rebase -X theirs "origin/${GITHUB_REF_NAME}" && git push && break
            sleep 5
          done
