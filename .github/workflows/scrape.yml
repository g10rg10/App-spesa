name: Aggiorna prezzi
on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 4 * * *"   # ogni giorno alle 04:17 UTC (05:17 / 06:17 in Italia)
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Installa dipendenze e browser headless
        run: npm ci && npx playwright install --with-deps chromium
      - run: node scraper/scrape.mjs
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FLYER_MODEL: ${{ vars.FLYER_MODEL }}
      - name: Salva i dati nel repo
        run: |
          git config user.name "prezzi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Prezzi $(date -u +%F)"
          git push
