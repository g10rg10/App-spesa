name: Aggiorna prezzi
on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 4 * * *"   # ogni giorno alle 04:17 UTC (05:17 / 06:17 in Italia)
    - cron: "17 14 * * *"  # secondo giro: con il piano gratuito di Groq (~1 pagina/minuto) recupera le pagine rimaste
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Installa dipendenze e browser headless
        run: npm ci && npx playwright install --with-deps chromium && sudo apt-get install -y poppler-utils
      - run: node scraper/scrape.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FLYER_MODEL: ${{ vars.FLYER_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          FLYER_MAX_PAGES: "400"
      - name: Salva i dati nel repo
        run: |
          git config user.name "prezzi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Prezzi $(date -u +%F)"
          git push
